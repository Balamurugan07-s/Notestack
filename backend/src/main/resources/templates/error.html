<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteStack – Page Not Found</title>
    <link rel="icon" type="image/png" href="/favicon-32.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #F8FAFC; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="text-center p-5 bg-white rounded-4 shadow-sm border" style="max-width: 500px;">
        <img src="/logo.svg" alt="NoteStack" width="64" height="64" class="mb-3">
        <h2 class="fw-bold text-dark mb-2">Note Not Found</h2>
        <p class="text-secondary mb-4" th:text="${error != null ? error : 'The requested resource is unavailable or has been removed.'}">The requested note link is invalid.</p>
        <a href="http://localhost:3000" class="btn btn-primary rounded-pill px-4" style="background: #4F46E5; border: none;">
            Return to NoteStack
        </a>
    </div>
</body>
</html>
