# ====================================================================
# NoteStack Application Configuration
# Spring Boot 3.x with MySQL, Spring Security, JWT, and Thymeleaf
# ====================================================================

spring.application.name=notestack-backend
server.port=8080

# --------------------------------------------------------------------
# Database Configuration (MySQL 8.0)
# --------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/notestack_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:scott}

# --------------------------------------------------------------------
# JPA / Hibernate Configuration
# --------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SQL Initialization (Set to 'always' if you want Spring Boot to run schema.sql / data.sql on startup)
spring.sql.init.mode=never

# --------------------------------------------------------------------
# File Upload Limits (Max 10MB per note file)
# --------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Local storage directory path for notes
notestack.storage.location=${FILE_UPLOAD_DIR:uploads}

# --------------------------------------------------------------------
# Security & JWT Configuration
# --------------------------------------------------------------------
# 256-bit secret key (Base64 or 32+ characters)
notestack.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Token validity: 86400000 ms = 24 hours
notestack.jwt.expiration-ms=86400000

# --------------------------------------------------------------------
# Thymeleaf Configuration
# --------------------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Static resources mapping
spring.web.resources.static-locations=classpath:/static/,file:uploads/

# --------------------------------------------------------------------
# Email Configuration (Password Reset & Notifications)
# --------------------------------------------------------------------
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --------------------------------------------------------------------
# Cross-Origin (CORS) & Host URLs
# --------------------------------------------------------------------
notestack.app.frontend-url=${FRONTEND_URL:http://localhost:3000}
notestack.app.backend-url=${BACKEND_URL:http://localhost:8080}
